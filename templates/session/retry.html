{% extends "base.html" %}
{% block title %}Mora — Retry{% endblock %}
{% block content %}
<div class="session-container">
    <div class="question-card retry-content">
        <p>Couldn't generate a question. Click below to try again.</p>
        <a href="{{ url_for('session.question', session_id=session_id) }}" class="btn btn-primary">Try Again</a>
        <a href="{{ url_for('session.end', session_id=session_id) }}" class="btn btn-secondary">End Session</a>
    </div>
</div>
{% endblock %}
